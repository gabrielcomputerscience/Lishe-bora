<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LisheBora Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aleo:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* AATF Brand Manual — primary */
  --green:#507435;      /* Pantone 370U */
  --gold:#AB822D;       /* Pantone 117U */
  /* secondary */
  --amber:#F9B916;      /* Pantone 123C */
  --purple:#912E91;     /* Pantone 253U */
  --yellow:#F1E90D;     /* Pantone 3965U */
  --leaf:#75BA43;       /* Pantone 376U */
  /* UI derivatives */
  --green-900:#2F4520; --green-800:#3C5829; --green-50:#EEF3E9; --green-100:#DCE7D2;
  --gold-50:#F7F0E1; --gold-700:#8A6823;
  --purple-50:#F5E8F5;
  --danger:#B23A2E; --danger-50:#F8E6E3;
  --ink:#1E2A17; --ink-2:#4B5842; --muted:#7A8471;
  --line:#E3E6DC; --bg:#F7F6F1; --surface:#FFFFFF;
  --radius:10px; --shadow:0 1px 2px rgba(30,42,23,.06),0 4px 14px rgba(30,42,23,.05);
  --serif:"Aleo","Book Antiqua",Georgia,serif;
  --sans:"Myriad Pro","Source Sans 3","Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);font-size:15px;color:var(--ink);background:var(--bg);line-height:1.45}
h1,h2,h3{font-family:var(--serif);color:var(--green-900);margin:0}
h1{font-size:26px;font-weight:700}
h2{font-size:18px;font-weight:600}
h3{font-size:15px;font-weight:600}
button,select,input,textarea{font-family:inherit;font-size:14px}
a{color:var(--green)}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.banner{background:var(--gold-50);color:var(--gold-700);font-size:12.5px;text-align:center;padding:5px 12px;border-bottom:1px solid #EADFC6}
.top{height:64px;background:#fff;border-bottom:3px solid var(--gold);display:flex;align-items:center;gap:16px;padding:0 20px;position:sticky;top:0;z-index:20}
.top .logo{height:34px;display:block}
.top .product{border-left:1px solid var(--line);padding-left:16px;display:flex;flex-direction:column;line-height:1.1}
.top .product b{font-family:var(--serif);color:var(--green);font-size:19px}
.top .product span{font-size:12px;color:var(--muted)}
.top .spacer{flex:1}
.rolesel{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.rolesel select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;color:var(--ink);max-width:230px}
.iconbtn{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.iconbtn .dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--amber);border:2px solid #fff}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{border:0;background:#fff;padding:6px 9px;cursor:pointer;color:var(--ink-2);font-size:12.5px}
.lang button.on{background:var(--green);color:#fff}

.app{display:flex;min-height:calc(100vh - 92px)}
.side{width:236px;flex:0 0 236px;background:var(--green-800);color:#E7EFE0;padding:14px 10px 20px;position:relative;overflow:hidden}
.side .vein{position:absolute;right:-40px;bottom:-20px;width:170px;height:220px;opacity:.12;pointer-events:none}
.side .grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#B9C9AA;padding:14px 12px 6px}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:#EEF4E8;text-align:left;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:14.5px;border-left:3px solid transparent;position:relative;z-index:1}
.nav:hover{background:rgba(255,255,255,.07)}
.nav.on{background:rgba(255,255,255,.12);border-left-color:var(--amber);color:#fff;font-weight:600}
.nav svg{flex:0 0 18px;opacity:.9}
.nav .badge{margin-left:auto;background:var(--amber);color:var(--green-900);font-size:11px;font-weight:700;border-radius:10px;padding:1px 7px}
.main{flex:1;min-width:0;padding:24px 28px 40px}
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:4px}
.pagehead{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.pagehead .sub{color:var(--ink-2);font-size:14px;margin-top:4px}
.pagehead .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- components ---------- */
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#C9CEBF}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:var(--green-800)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.danger{color:var(--danger);border-color:#E7C1BB}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card>h2,.card>h3{margin-bottom:12px}
.card .hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card .hd h2,.card .hd h3{margin:0}
.card .hd .r{margin-left:auto;font-size:12.5px;color:var(--muted)}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:2fr 1fr}
.g12{grid-template-columns:1fr 2fr}
.kpi{padding:16px 18px;border-top:4px solid var(--green)}
.kpi.gold{border-top-color:var(--gold)} .kpi.amber{border-top-color:var(--amber)} .kpi.purple{border-top-color:var(--purple)} .kpi.leaf{border-top-color:var(--leaf)}
.kpi .l{font-size:13px;color:var(--ink-2)}
.kpi .v{font-family:var(--serif);font-size:28px;font-weight:700;color:var(--green-900);margin:4px 0 2px}
.kpi .d{font-size:12.5px;color:var(--muted)}
.kpi .d .up{color:var(--green);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-green{background:var(--green-50);color:var(--green)}
.p-gold{background:var(--gold-50);color:var(--gold-700)}
.p-amber{background:#FEF3D3;color:#8A6400}
.p-purple{background:var(--purple-50);color:var(--purple)}
.p-red{background:var(--danger-50);color:var(--danger)}
.p-grey{background:#EFF0EC;color:#5E6656}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);background:#FBFBF8}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.tablewrap{overflow-x:auto;margin:0 -18px -18px;padding:0}
.tablewrap table{min-width:560px}
.tablewrap th:first-child,.tablewrap td:first-child{padding-left:18px}
.tablewrap th:last-child,.tablewrap td:last-child{padding-right:18px}
.muted{color:var(--muted)} .small{font-size:12.5px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.field input,.field select,.field textarea{border:1px solid #D5D9CC;border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--green-100);border-color:var(--green)}
.hint{font-size:12px;color:var(--muted)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stack>*+*{margin-top:16px}
.steps{display:flex;gap:0;margin:4px 0 18px;overflow-x:auto}
.step{flex:1;min-width:110px;text-align:center;font-size:12px;color:var(--muted);position:relative;padding-top:26px}
.step:before{content:"";position:absolute;top:10px;left:0;right:0;height:3px;background:var(--line)}
.step:after{content:"";position:absolute;top:4px;left:50%;margin-left:-8px;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--line)}
.step.done{color:var(--green)} .step.done:before{background:var(--green)} .step.done:after{background:var(--green);border-color:var(--green)}
.step.cur{color:var(--gold-700);font-weight:700} .step.cur:before{background:linear-gradient(90deg,var(--green) 50%,var(--line) 50%)} .step.cur:after{border-color:var(--gold);background:var(--amber)}
.alert{display:block;padding:10px 12px;border-radius:8px;font-size:13.5px}
.alert.warn{background:#FEF6DD;color:#6E5100;border:1px solid #F5E1A3}
.alert.info{background:var(--green-50);color:var(--green-900);border:1px solid var(--green-100)}
.alert.bad{background:var(--danger-50);color:#7E2A21;border:1px solid #EBC5BF}
.bar{height:8px;background:#EEF0E9;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:6px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.sev{width:8px;height:34px;border-radius:4px;flex:0 0 8px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:#FBFBF8;border:1px solid var(--line);border-radius:8px;font-size:14px}
.chk input{margin-top:3px;accent-color:var(--green);width:16px;height:16px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--green-900);color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;transition:.25s;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.2);border-left:4px solid var(--amber)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--ink-2);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--green);border-bottom-color:var(--gold)}
.score{font-family:var(--serif);font-size:34px;font-weight:700;color:var(--green)}
.mx td,.mx th{text-align:center;font-size:12px;padding:6px 4px}
.mx td:first-child,.mx th:first-child{text-align:left}
.mx .c{font-weight:600;color:var(--green-900)}
.mx .n{color:#C3C8BB}

/* phone frame */
.phone{width:340px;border-radius:34px;background:#1d1d1d;padding:12px;box-shadow:0 12px 30px rgba(0,0,0,.2);margin:0 auto}
.screen{background:var(--bg);border-radius:24px;overflow:hidden;height:700px;display:flex;flex-direction:column}
.ph-top{background:var(--green);color:#fff;padding:12px 14px 10px}
.ph-top .t{font-family:var(--serif);font-size:16px;font-weight:600}
.ph-body{padding:12px;overflow-y:auto;flex:1}
.ph-body .card{padding:12px;box-shadow:none}
.net{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:rgba(255,255,255,.18);padding:3px 9px;border-radius:12px;cursor:pointer;border:0;color:#fff}
.net i{width:8px;height:8px;border-radius:50%;background:var(--leaf)}
.net.off i{background:var(--amber)}
.photo{height:84px;border:2px dashed #CFD4C5;border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:13px;cursor:pointer;background:#fff}
.photo.got{border-style:solid;border-color:var(--green);background:var(--green-50);color:var(--green)}
.sig{height:70px;border:1px solid #CFD4C5;border-radius:8px;background:#fff;position:relative}
.sig svg{position:absolute;inset:0}

/* landing */
.landing{min-height:calc(100vh - 29px);display:grid;grid-template-columns:1.05fr 1fr;background:#fff}
.landing .l{padding:48px 56px;display:flex;flex-direction:column}
.landing .l .logo{height:64px;align-self:flex-start}
.landing .l h1{font-size:40px;margin:48px 0 10px;color:var(--green)}
.landing .l .tag{font-size:17px;color:var(--ink-2);max-width:520px}
.landing .r{background:var(--green);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:40px}
.landing .r svg.v{position:absolute;inset:0;width:100%;height:100%}
.landing .panel{position:relative;background:#fff;border-radius:14px;padding:26px;width:min(420px,100%);box-shadow:0 20px 40px rgba(0,0,0,.18)}
.rolegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.roleopt{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;text-align:left;cursor:pointer}
.roleopt:hover{border-color:var(--green);background:var(--green-50)}
.roleopt b{display:block;font-size:14px;color:var(--green-900)}
.roleopt span{font-size:12px;color:var(--muted)}
.flow{display:flex;flex-wrap:wrap;gap:6px;margin-top:28px}
.flow span{font-size:12.5px;padding:4px 10px;border-radius:14px;background:var(--green-50);color:var(--green-900);border:1px solid var(--green-100)}
.flow span:nth-child(3n+2){background:var(--gold-50);border-color:#EADFC6;color:var(--gold-700)}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g21,.g12,.g3{grid-template-columns:1fr}}
@media (max-width:820px){
  .side{position:fixed;left:-260px;top:92px;bottom:0;z-index:30;transition:left .2s}
  .side.open{left:0}
  .menu{display:grid!important}
  .top .product span,.rolesel span,.lang{display:none}
  .main{padding:16px}
  .g2{grid-template-columns:1fr}
  .landing{grid-template-columns:1fr}.landing .l{padding:28px 20px}.landing .l h1{font-size:30px;margin-top:28px}
  .landing .r{padding:24px 16px}
}
@media (max-width:520px){.g4{grid-template-columns:1fr}.top{padding:0 12px;gap:10px}.top .product{display:none}.rolegrid{grid-template-columns:1fr}.phone{width:100%}}
/* public site */
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.stop{background:#fff;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:20}
.srow{display:flex;align-items:center;gap:18px;height:68px}
.srow .logo{height:36px}.srow .product{border-left:1px solid var(--line);padding-left:14px}.srow .product b{font-family:var(--serif);color:var(--green);font-size:20px}
.snav{display:flex;gap:2px;margin-left:12px;flex-wrap:wrap}
.snav a{color:var(--ink-2);text-decoration:none;padding:8px 10px;border-radius:6px;font-weight:600;font-size:14.5px}
.snav a:hover{background:var(--green-50)}.snav a.on{color:var(--green);box-shadow:inset 0 -3px 0 var(--gold)}
.hero{background:var(--green);color:#fff;position:relative;overflow:hidden}
.hero-in{position:relative;padding:72px 24px 80px;max-width:1180px}
.hero .eyebrow{color:var(--amber);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px}
.hero h1{color:#fff;font-size:44px;line-height:1.12;max-width:680px;margin:12px 0 16px}
.hero p{font-size:18px;max-width:600px;color:#E7EFE0;margin:0 0 26px}
.btn.lg{padding:12px 20px;font-size:15.5px}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.6)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:-36px;position:relative}
.stats>div{background:#fff;border-radius:10px;padding:18px;box-shadow:var(--shadow);border-top:4px solid var(--gold)}
.stats b{display:block;font-family:var(--serif);font-size:30px;color:var(--green-900)}.stats span{font-size:13.5px;color:var(--ink-2)}
.sec{padding:44px 24px}.narrow{max-width:820px}
h2.h{font-size:24px;margin:0 0 16px}
.lead{font-size:17px;color:var(--ink-2)}
.howc .n{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--gold);color:#fff;font-weight:700;margin-bottom:10px}
.howc p{margin:6px 0 0;font-size:14px}
.newsc{cursor:pointer;transition:.15s}.newsc:hover{transform:translateY(-2px);border-color:var(--green-100)}
.newsc .thumb{height:120px;border-radius:8px;background:linear-gradient(135deg,var(--green),var(--green-800));margin:-4px -4px 12px;position:relative;overflow:hidden}
.newsc .thumb svg{position:absolute;right:-20px;top:-10px;width:160px;height:160px;opacity:.25}
.band{background:var(--green-800);padding:34px 0;margin-top:20px}
.sfoot{background:#22321A;color:#C9D6BE;padding:40px 0;font-size:14px}
.fgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:24px}
.fgrid b{display:block;color:#fff;margin-bottom:8px}.fgrid a,.fgrid span{display:block;color:#C9D6BE;text-decoration:none;margin:4px 0}.fgrid a:hover{color:var(--amber)}
.partners{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:10px 0}
.plogo{height:70px;border:1px dashed #CFD4C5;border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:13px;background:#fff}
.ticks{list-style:none;padding:0;margin:8px 0 18px}.ticks li{padding:6px 0 6px 28px;position:relative}.ticks li:before{content:"";position:absolute;left:4px;top:11px;width:12px;height:7px;border-left:2.5px solid var(--green);border-bottom:2.5px solid var(--green);transform:rotate(-45deg)}
.faq{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-top:10px}.faq summary{font-weight:600;cursor:pointer;color:var(--green-900)}.faq p{margin:10px 0 0;color:var(--ink-2)}
.or{text-align:center;color:var(--muted);font-size:13px;margin:12px 0;position:relative}
.otp{display:flex;gap:8px}.otp input{width:46px;height:52px;text-align:center;font-size:20px;border:1px solid #D5D9CC;border-radius:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid var(--line);border-radius:18px;padding:5px 10px;font-size:13px;display:inline-flex;gap:6px;align-items:center;background:#fff;font-weight:400!important}.chip input{accent-color:var(--green)}
.upl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:#fff;font-size:14px}
.done-ic{width:56px;height:56px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:28px;margin-bottom:14px}
.roleopt.sel{border-color:var(--green);background:var(--green-50);box-shadow:inset 3px 0 0 var(--gold)}
.side-panel{max-width:380px}
.stars{color:var(--amber);font-size:20px;letter-spacing:2px}
.wfs{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.wfs .n{width:30px;height:30px;border-radius:50%;background:var(--green-50);color:var(--green);display:grid;place-items:center;font-weight:700;font-size:13px}
.smenu{display:none}
@media (max-width:1100px){.snav{display:none}.snav.open{display:flex;flex-direction:column;position:absolute;top:68px;left:0;right:0;background:#fff;padding:10px 24px 16px;border-bottom:1px solid var(--line);margin:0;box-shadow:0 8px 16px rgba(0,0,0,.06)}.smenu{display:grid}.stats{grid-template-columns:repeat(2,1fr)}.fgrid{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.hero h1{font-size:30px}.hero-in{padding:44px 20px 60px}.stats,.fgrid,.partners{grid-template-columns:1fr}.srow .product{display:none}.srow{gap:10px}.srow .btn{padding:7px 10px}}
.landing .step{min-width:0}
.menu{display:none}
@media (max-width:520px){.top .iconbtn:not(.menu),.top .avatar{display:none}.rolesel select{max-width:180px}.top .logo{height:28px}}
</style>
</head>
<body>
<div class="banner">Design mockup: all names and figures are illustrative placeholders, not programme data.</div>
<div id="root"></div>

/* ---------- render shell ---------- */
function render(){
  const root=document.getElementById('root');
  if(S.mode==='site'){root.innerHTML=site();return}
  if(S.mode==='auth'){root.innerHTML=authView();return}
  if(!S.role){S.mode='auth';S.auth='pick';root.innerHTML=authView();return}
  const R=ROLES[S.role];
  if(!R.nav.includes(S.view))S.view=R.nav[0];
  let grp='';let nav='';
  NAV.filter(n=>R.nav.includes(n.id)).forEach(n=>{
    if(n.grp!==grp){grp=n.grp;nav+=`<div class="grp">${grp}</div>`}
    nav+=`<button class="nav ${S.view===n.id?'on':''}" onclick="go('${n.id}')">${ic(n.ic)}<span>${n.label}</span>${n.badge?`<span class="badge">${n.badge}</span>`:''}</button>`;
  });
  root.innerHTML=`
  <header class="top">
    <button class="iconbtn menu" aria-label="Menu" onclick="document.querySelector('.side').classList.toggle('open')">${ic('menu')}</button>
    <img class="logo" src="${LOGO}" alt="AATF">
    <div class="product"><b>LisheBora</b><span>School food e-Sourcing Platform</span></div>
    <div class="spacer"></div>
    <div class="lang"><button class="${S.lang==='en'?'on':''}" onclick="toast('Language switch — English / Kiswahili (translations to be supplied)')">EN</button><button class="${S.lang==='sw'?'on':''}" onclick="toast('Kiswahili UI: translations to be validated by the programme team')">SW</button></div>
    <label class="rolesel"><span>Viewing as</span>
      <select onchange="setRole(this.value)">${Object.entries(ROLES).map(([k,r])=>`<option value="${k}" ${k===S.role?'selected':''}>${r.name}</option>`).join('')}</select></label>
    <button class="btn sm" onclick="page('home')" title="Open public website">${ic('globe',16)} Website</button>
    <button class="iconbtn" aria-label="Notifications" onclick="go('notifications')">${ic('bell')}<span class="dot"></span></button>
    <div class="avatar" title="${R.name}">${R.init}</div>
    <button class="iconbtn" aria-label="Sign out" title="Sign out" onclick="S.role=null;page('home');toast('Signed out')">${ic('out')}</button>
  </header>
  <div class="app">
    <nav class="side">${nav}
      <div class="grp" style="margin-top:18px">Signed in</div>
      <div style="padding:0 12px;font-size:13px;line-height:1.35;position:relative;z-index:1"><b style="color:#fff">${R.name}</b><br><span style="color:#C9D6BE">${R.who}</span><br><span style="color:#C9D6BE">Scope: ${R.scope}</span></div>
      ${vein('#F9B916',9)}
    </nav>
    <main class="main" id="main">${VIEWS[S.view]()}</main>
  </div>`;
  after();
}
function go(v){S.view=v;render();window.scrollTo(0,0)}
function setRole(r){S.mode='app';S.role=r;S.view=ROLES[r].nav[0];render();window.scrollTo(0,0)}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2600)}
function head(crumb,title,sub,actions=''){return `<div class="crumb">${crumb}</div><div class="pagehead"><div><h1>${title}</h1>${sub?`<div class="sub">${sub}</div>`:''}</div><div class="actions">${actions}</div></div>`}

/* ---------- charts (inline SVG) ---------- */
function hbars(data,max,color='var(--green)'){
  return data.map(d=>`<div style="display:grid;grid-template-columns:110px 1fr 70px;gap:10px;align-items:center;margin:8px 0;font-size:13.5px">
    <span>${d[0]}</span><div class="bar" style="height:12px"><i style="width:${d[1]/max*100}%;background:${d[2]||color}"></i></div><span class="num r" style="text-align:right">${d[3]||d[1]}</span></div>`).join('');
}
function lineChart(){
  const a=[31,38,42,47,52,58], b=[22,24,31,33,40,44], m=['Apr','May','Jun','Jul','Aug','Sep'];
  const X=i=>40+i*84, Y=v=>170-v*2.2;
  const p=s=>s.map((v,i)=>`${i?'L':'M'}${X(i)},${Y(v)}`).join('');
  return `<svg viewBox="0 0 480 200" width="100%" role="img" aria-label="Local sourcing and inclusion share trend">
   ${[0,20,40,60].map(v=>`<line x1="40" x2="460" y1="${Y(v)}" y2="${Y(v)}" stroke="#E3E6DC"/><text x="32" y="${Y(v)+4}" font-size="11" text-anchor="end" fill="#7A8471">${v}%</text>`).join('')}
   ${m.map((t,i)=>`<text x="${X(i)}" y="192" font-size="11" text-anchor="middle" fill="#7A8471">${t}</text>`).join('')}
   <path d="${p(a)}" fill="none" stroke="#507435" stroke-width="2.5"/><path d="${p(b)}" fill="none" stroke="#AB822D" stroke-width="2.5"/>
   ${a.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="#507435"/>`).join('')}${b.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="#AB822D"/>`).join('')}
</svg>`;
}
function donut(parts){
  let acc=0;const r=52,c=2*Math.PI*r;
  return `<svg viewBox="0 0 140 140" width="140" height="140">${parts.map(p=>{const len=p[1]/100*c;const s=`<circle cx="70" cy="70" r="${r}" fill="none" stroke="${p[2]}" stroke-width="18" stroke-dasharray="${len-2} ${c-len+2}" stroke-dashoffset="${-acc}" transform="rotate(-90 70 70)"/>`;acc+=len;return s}).join('')}
  <text x="70" y="68" text-anchor="middle" font-family="Aleo,serif" font-size="22" font-weight="700" fill="#2F4520">44%</text><text x="70" y="86" text-anchor="middle" font-size="10" fill="#7A8471">inclusive</text></svg>`;
}

  opps:()=>`<section class="wrap sec"><h1>Opportunities</h1><p class="lead">Published sourcing notices. You need to sign in, as a registered and prequalified supplier, to bid.</p>${noticeTable(NOTICES.filter(n=>n[5]))}
    <h2 class="h" style="margin-top:28px">Recent awards</h2><div class="card"><div class="tablewrap"><table><tr><th>Reference</th><th>Title</th><th>Awarded to</th><th class="r">Value</th><th>Date</th></tr>${AWARDS.map(a=>`<tr><td><b>${a[0]}</b></td><td>${a[1]}</td><td>${a[2]}</td><td class="r num">${a[3]}</td><td>${a[4]}</td></tr>`).join('')}</table></div></div><p class="small muted">Award decisions are published for transparency.</p></section>`,
  news:()=>`<section class="wrap sec"><h1>News &amp; updates</h1><div class="grid g3" style="margin-top:16px">${pub.map(newsCard).join('')}</div></section>`,
  article:()=>{const n=SITE.news.find(x=>x.id===S.article)||pub[0];return `<section class="wrap sec narrow"><a href="#" onclick="page('news');return false">← News</a><div class="small muted" style="margin-top:14px">${n.tag} · ${n.date}</div><h1 style="margin-top:6px">${n.title}</h1><p class="lead">${n.summary}</p><p>[Full article body, written and published by the content editor in the CMS.]</p></section>`},
  resources:()=>`<section class="wrap sec narrow"><h1>Resources</h1><div class="card" style="margin-top:16px"><ul class="list">${SITE.resources.map(r=>`<li>${ic('doc')}<div><b>${r[0]}</b><div class="small muted">${r[1]}</div></div><button class="btn sm" style="margin-left:auto" onclick="toast('Download (admin-uploaded file)')">Download</button></li>`).join('')}</ul></div></section>`,
  faq:()=>`<section class="wrap sec narrow"><h1>Frequently asked questions</h1>${SITE.faq.map((f,i)=>`<details class="faq" ${i?'':'open'}><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join('')}</section>`,
  contact:()=>`<section class="wrap sec narrow"><h1>Contact &amp; feedback</h1><p class="lead">Questions, feedback or a grievance? Send us a message. Registered users can also raise a case from their portal and track it.</p>
    <div class="card"><div class="grid g2"><div class="field"><label>Name</label><input></div><div class="field"><label>Phone or email</label><input></div></div>

    <div class="field"><label>Message</label><textarea rows="4"></textarea></div><button class="btn primary" onclick="toast('Prototype: message not sent. The live system logs it as a case.')">Send message</button></div></section>`,
  };
  return `<header class="stop"><div class="wrap srow">
    <img class="logo" src="${LOGO}" alt="AATF" onclick="page('home')" style="cursor:pointer">

}
function noticeTable(rows){return `<div class="card" style="margin-top:14px"><div class="tablewrap"><table><tr><th>Reference</th><th>Title</th><th>County</th><th>Eligibility</th><th>Closes</th><th></th></tr>${rows.map(n=>`<tr><td><b>${n[0]}</b></td><td>${n[1]}</td><td>${n[2]}</td><td class="small">${n[4]}</td><td class="num">${n[3]}</td><td class="r"><button class="btn sm primary" onclick="auth('signin')">Sign in to bid</button></td></tr>`).join('')}</table></div></div>`}
function newsCard(n){return `<article class="card newsc" onclick="S.article=${n.id};page('article')"><div class="thumb">${vein('#FFFFFF',10)}</div><div class="small muted">${n.tag} · ${n.date}</div><h3 style="margin:6px 0">${n.title}</h3><p class="muted small" style="margin:0">${n.summary}</p></article>`}
function page(p){S.mode='site';S.page=p;S.snav=false;render();window.scrollTo(0,0)}
function auth(a){S.mode='auth';S.auth=a;S.regStep=S.regStep||1;render();window.scrollTo(0,0)}

/* =================== SIGN IN / REGISTER =================== */
function authView(){
  const a=S.auth;
  const shell=(inner)=>`<div class="landing"><div class="l">
     <img class="logo" src="${LOGOTAG}" alt="AATF: Prosperity through technology" style="cursor:pointer" onclick="page('home')">
     <div style="margin:auto 0;max-width:440px;width:100%">${inner}</div>
     <div class="small muted">Prototype: nothing you type is sent or stored. <a href="#" onclick="page('home');return false">← Back to website</a></div></div>
   <div class="r">${vein('#AB822D',12)}<div class="panel side-panel">${a==='register'?regAside():signinAside()}</div></div></div>`;
  if(a==='signin') return shell(`<h1>Sign in</h1><p class="muted">Use your email or mobile number.</p>
     <div class="field"><label>Email or mobile number</label><input placeholder="e.g. 07XX XXX XXX"></div>
     <div class="field"><label>Password</label><input type="password" autocomplete="off"></div>
     <div class="row" style="justify-content:space-between;margin-bottom:14px"><label class="small"><input type="checkbox"> Keep me signed in on this device</label><a href="#" class="small" onclick="auth('forgot');return false">Forgot password?</a></div>
     <button class="btn primary lg" style="width:100%;justify-content:center" onclick="auth('mfa')">Sign in</button>
     <div class="or">or</div><button class="btn lg" style="width:100%;justify-content:center" onclick="auth('otp')">Sign in with a one-time SMS code</button>
     <p class="small" style="margin-top:18px">New supplier or school? <a href="#" onclick="S.regStep=1;auth('register');return false">Create an account</a></p>`);
  if(a==='otp') return shell(`<h1>Sign in with SMS code</h1><p class="muted">We will send a 6-digit code to your registered phone.</p><div class="field"><label>Mobile number</label><input placeholder="07XX XXX XXX"></div><button class="btn primary lg" style="width:100%;justify-content:center" onclick="auth('mfa')">Send code</button><p class="small"><a href="#" onclick="auth('signin');return false">← Use password instead</a></p>`);
  if(a==='forgot') return shell(`<h1>Reset your password</h1><p class="muted">Enter your email or mobile number. We will send a reset link or code.</p><div class="field"><label>Email or mobile number</label><input></div><button class="btn primary lg" style="width:100%;justify-content:center" onclick="toast('Reset link / code sent (prototype)');auth('signin')">Send reset instructions</button><p class="small"><a href="#" onclick="auth('signin');return false">← Back to sign in</a></p>`);
  if(a==='mfa') return shell(`<h1>Verify it’s you</h1><p class="muted">Enter the 6-digit code sent to 07•• ••• 214. Admin, approval, procurement and finance roles must use two-step verification.</p>
     <div class="otp">${[1,2,3,4,5,6].map(()=>`<input maxlength="1" inputmode="numeric">`).join('')}</div>
     <button class="btn primary lg" style="width:100%;justify-content:center;margin-top:14px" onclick="auth('pick')">Verify</button><p class="small muted">Didn’t get it? <a href="#" onclick="toast('Code resent');return false">Resend</a> · Account locks after 5 failed attempts.</p>`);
  if(a==='pick') return shell(`<h1>Demo: choose a role</h1><p class="muted">In the live system your role and data scope come from your account. Here you can pick one to explore.</p>
     <div class="rolegrid">${Object.entries(ROLES).map(([k,r])=>`<button class="roleopt" onclick="setRole('${k}')"><b>${r.name}</b><span>${ROLEDESC[k]}</span></button>`).join('')}</div>`);
  if(a==='register'){
    const st=S.regStep, T=S.regType||'coop';
    const steps=['Account type','Details','Inclusion','Documents','Verify'];
    const bar=`<div class="steps">${steps.map((s,i)=>`<div class="step ${i+1<st?'done':''} ${i+1===st?'cur':''}">${s}</div>`).join('')}</div>`;
    const nav=(back,next,label='Continue')=>`<div class="row" style="margin-top:8px">${back?`<button class="btn" onclick="S.regStep--;render()">Back</button>`:''}<button class="btn primary" style="margin-left:auto" onclick="${next}">${label}</button></div>`;
    const types=[['farmer','Individual farmer','Sell your own produce'],['coop','Farmer group / cooperative','Register the group and its members'],['agg','Aggregator','Buy from farmers, grade and supply'],['trader','Trader / processor / MSME','Registered business supplier'],['school','School','Invited by the county; activation code needed'],['official','County / programme staff','Invitation only: set up by administrator']];
    let inner='';
    if(st===1) inner=`<h1>Create an account</h1><p class="muted">Which best describes you?</p>${bar}<div class="rolegrid" style="grid-template-columns:1fr">${types.map(t=>`<button class="roleopt ${T===t[0]?'sel':''}" onclick="S.regType='${t[0]}';render()"><b>${t[1]}</b><span>${t[2]}</span></button>`).join('')}</div>${nav(false,"S.regStep=2;render()")}`;
    if(st===2) inner=`<h1>${T==='coop'?'Group details':'Your details'}</h1>${bar}
      <div class="field"><label>${T==='coop'?'Registered group name':T==='farmer'?'Full name':'Business name'}</label><input></div>
      <div class="grid g2"><div class="field"><label>${T==='coop'?'Registration no. (e.g. co-operative, self-help group)':'ID / registration no.'}</label><input></div><div class="field"><label>KRA PIN ${T==='farmer'?'(optional)':''}</label><input></div></div>
      <div class="grid g2"><div class="field"><label>Mobile number</label><input placeholder="07XX XXX XXX"></div><div class="field"><label>Email (optional)</label><input></div></div>
      <div class="grid g2"><div class="field"><label>County</label><select><option>Pilot County A</option><option>Pilot County B</option></select></div><div class="field"><label>Sub-county / ward</label><input></div></div>
      <div class="field"><label>Commodities you supply</label><div class="chips">${['Maize','Beans','Rice','Green grams','Vegetables','Fruit','Eggs','Milk','Cooking oil'].map((c,i)=>`<label class="chip"><input type="checkbox" ${i<2?'checked':''}> ${c}</label>`).join('')}</div></div>
      ${T==='coop'?'<div class="field"><label>Number of members</label><input type="number" value="146"><span class="hint">You can upload the member list in the Documents step or add members later.</span></div>':''}
      <div class="field"><label>Preferred language for SMS</label><select><option>English</option><option>Kiswahili</option></select></div>
      ${nav(true,"S.regStep=3;render()")}`;
    if(st===3) inner=`<h1>Inclusion information</h1>${bar}<p class="muted small">This helps the programme track fair access for women, youth and persons with disabilities. Some procurement criteria reward inclusion, and a county officer verifies your status before it counts.</p>
      <div class="field"><label>${T==='coop'?'Who leads the group?':'Ownership'}</label><select><option>Women-led / majority women-owned</option><option>Youth-led (18–35)</option><option>Led by a person with disability</option><option>None of these</option><option>Prefer not to say</option></select></div>
      ${T==='coop'?'<div class="grid g2"><div class="field"><label>% women members</label><input type="number"></div><div class="field"><label>% youth members</label><input type="number"></div></div>':''}
      <label class="chk"><input type="checkbox"> I consent to LisheBora processing this information for programme monitoring, as described in the privacy notice (Data Protection Act, 2019).</label>
      ${nav(true,"S.regStep=4;render()")}`;
    if(st===4) inner=`<h1>Documents</h1>${bar}<p class="muted small">Upload now or later. You need these for prequalification. Photos taken on a phone are fine.</p>
      ${[['Registration certificate / ID',true],['KRA PIN certificate',T!=='farmer'],['Food-safety or public-health certificate',false],['Member list',T==='coop'],['Bank or M-Pesa details',true]].map(d=>`<div class="upl"><div><b>${d[0]}</b>${d[1]?' <span class="pill p-gold">Required</span>':' <span class="pill p-grey">If available</span>'}</div><button class="btn sm" onclick="this.outerHTML='<span class=&quot;pill p-green&quot;>Uploaded</span>'">Upload</button></div>`).join('')}
      ${nav(true,"S.regStep=5;render()")}`;
    if(st===5) inner=`<h1>Verify your phone</h1>${bar}<p class="muted">Enter the code we sent by SMS, then set your password.</p><div class="otp">${[1,2,3,4,5,6].map(()=>`<input maxlength="1" inputmode="numeric">`).join('')}</div>
      <div class="field" style="margin-top:14px"><label>Create password</label><input type="password" autocomplete="off"><span class="hint">At least 10 characters.</span></div>
      <label class="chk"><input type="checkbox"> I accept the terms of use and privacy notice.</label>${nav(true,"S.regStep=6;render()",'Create account')}`;
    if(st===6) inner=`<div class="done-ic">✓</div><h1>Account created</h1><p class="muted">Your application is <b>submitted for prequalification</b>. A county procurement officer will check your documents. We will SMS you when you are approved, usually within [x] working days.</p>
      <div class="steps">${['Submitted','Under review','Approved','Prequalified','Active'].map((s,i)=>`<div class="step ${i===0?'done':''} ${i===1?'cur':''}">${s}</div>`).join('')}</div>
      <div class="row"><button class="btn primary" onclick="setRole('supplier')">Go to supplier portal</button><button class="btn" onclick="page('home')">Back to website</button></div>`;
    return shell(inner);
  }
}
function signinAside(){return `<h2>Welcome to LisheBora</h2><ul class="ticks" style="margin-top:12px"><li>Suppliers: find opportunities, bid and track payments</li><li>Schools: plan demand and confirm deliveries</li><li>Counties: approve, monitor and report</li></ul><div class="alert info" style="margin-top:14px">Staff and school accounts are created by invitation. Suppliers can self-register.</div>`}

/* ---------- behaviours ---------- */
function calc(){
  const t=document.getElementById('dtab');if(!t)return;
  const L=+document.getElementById('lr').value||0,A=(+document.getElementById('att').value||0)/100,D=+document.getElementById('fd').value||0,W=(+document.getElementById('wf').value||0)/100;
  const menu=document.getElementById('mn').value;
  const items=menu==='std'?[['Maize',150,2400],['Beans',40,380],['Vegetables',60,0],['Cooking oil',10,90]]:[['Rice',120,900],['Beans',40,380],['Vegetables',60,0],['Cooking oil',10,90]];
  let rows=`<tr><th>Commodity</th><th class="r">Portion (g)</th><th class="r">Gross need (kg)</th><th class="r">Stock (kg)</th><th class="r">To procure (kg)</th></tr>`;let warn=[];
  items.forEach(([n,g,s])=>{const gross=L*A*D*g/1000*(1+W);const net=Math.max(0,gross-s);rows+=`<tr><td>${n}</td><td class="r num">${g}</td><td class="r num">${fmt(Math.round(gross))}</td><td class="r num">${fmt(s)}</td><td class="r num"><b>${fmt(Math.round(net))}</b></td></tr>`;if(gross>20000)warn.push(n)});
  t.innerHTML=rows;
  const v=document.getElementById('dval');
  v.innerHTML=(L>1500?'<div class="alert warn">Enrolment is well above last term (612). Please confirm the figure before submitting.</div>':'')+
   (warn.length?`<div class="alert warn" style="margin-top:8px">Unusually high quantity: ${warn.join(', ')}. The county officer will be alerted.</div>`:'')+
   `<div class="alert info" style="margin-top:8px">Menu check: ${menu==='std'?'4 of 7 food groups. Add fruit or an animal-source food to meet the diversity rule.':'4 of 7 food groups.'}</div>`;
}
function confirmPOD(){
  if(!S.online){S.queue.push('e-POD DSP-0219 · 2 items · 2 photos · signature');toast('Saved offline · will sync when connected');}
  else toast('Receipt recorded · goods received note created · supplier notified');
  S.photo=false;S.signed=false;render();
}
function after(){calc()}
render();
